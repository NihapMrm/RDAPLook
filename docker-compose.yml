services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdaplook-app
    restart: always
    env_file: .env
    volumes:
      - rdaplook-public:/var/www/html/public
      - rdaplook-storage:/var/www/html/storage
      - rdaplook-cache:/var/www/html/bootstrap/cache
    networks:
      - rdaplook-network
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdaplook-worker
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file: .env
    volumes:
      - rdaplook-storage:/var/www/html/storage
      - rdaplook-cache:/var/www/html/bootstrap/cache
    networks:
      - rdaplook-network
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: rdaplook-nginx
    restart: always
    ports:
      - "127.0.0.1:8100:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - rdaplook-public:/var/www/html/public:ro
    networks:
      - rdaplook-network
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    container_name: rdaplook-redis
    restart: always
    volumes:
      - rdaplook-redis:/data
    networks:
      - rdaplook-network

networks:
  rdaplook-network:
    driver: bridge

volumes:
  rdaplook-public:
  rdaplook-storage:
  rdaplook-cache:
  rdaplook-redis:
